      <h1>Registration Form</h1>
      <form action="submit_registration.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required /><br /><br />

        <label for="birthplace">Birth Place:</label>
        <input type="text" id="birthplace" name="birthplace" required /><br /><br />

        <label for="birthdate">Birth Date:</label>
        <input type="date" id="birthdate" name="birthdate" required /><br /><br />
        
        <label for="address">Address:</label>
        <textarea id="address" name="address" required></textarea><br /><br />

        <label for="religion">Religion:</label>
        <input type="text" id="religion" name="religion" required /><br /><br />

        <label for="marriage_status">Marriage Status:</label>
        <input type="text" id="marriage_status" name="marriage_status" required /><br /><br />

        <label for="job">Job:</label>
        <input type="text" id="job" name="job" required /><br /><br />
  
        <label for="citizenship">Citizenship:</label>
        <input type="text" id="citizenship" name="citizenship" required /><br /><br />
      
        <label for="valid_until">Valid Until:</label>
        <input type="text" id="valid_until" name="valid_until" required /><br /><br />
      
        <label for="ktp">KTP:</label>
        <input type="file" id="ktp" name="ktp" required /><br /><br />

        <input type="submit" value="Register" />
      </form>
